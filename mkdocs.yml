site_name: Trade Journal Documentation
site_description: Institutional Commodity & Futures Trading Journal, Multi-Leg Strategy Manager, and Fundamentals Analytics
site_author: Nizam Ansari
site_url: https://nansari-0134.github.io/trade_journal/
repo_name: nansari-0134/trade_journal
repo_url: https://github.com/nansari-0134/trade_journal

theme:
  name: material
  language: en
  palette:
    # Palette toggle for dark mode (default)
    - scheme: slate
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    # Palette toggle for light mode
    - scheme: default
      primary: cyan
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - navigation.tracking
    - navigation.indexes
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.arithmatex:
      generic: true
  - tables
  - attr_list
  - md_in_html
  - toc:
      permalink: true

extra_javascript:
  - https://polyfill.io/v3/polyfill.min.js?features=es6
  - https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Getting Started:
      - Overview & Architecture: getting-started/overview.md
      - Installation & Setup: getting-started/installation.md
      - Quickstart Walkthrough: getting-started/quickstart.md
  - Core Modules:
      - Executive Dashboard: features/dashboard.md
      - Multi-Leg Trade Execution: features/trade-management.md
      - Position Adjustments & Audit: features/position-adjustments.md
      - CFTC Commitments of Traders: features/cot-reports.md
      - Palm Oil (FCPO) Fundamentals: features/palm-oil.md
      - Planning & Calendar: features/calendar-planning.md
  - Step-by-Step Guides:
      - How to Add More Products: guides/adding-products.md
      - How to Add Strategies & Pairs: guides/adding-strategies.md
      - Fee Modeling & Multipliers: guides/fee-modeling.md
  - Technical Reference:
      - Relational Models & Schemas: reference/architecture.md
      - Multiplier & PnL Formulas: reference/formulas.md
